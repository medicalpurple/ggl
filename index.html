<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@thisara · Anonymous messages</title>
<style>
:root{
  --pink:#ec1187; --orange:#ff8d10; --ink:#000; --paper:#fff;
  --glass:rgba(255,255,255,.4); --hint:rgba(0,0,0,.25); --faint:rgba(255,255,255,.55);
  --avatar-bg:#f1f1f1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px "Avenir Next",Helvetica,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(to right bottom,var(--pink) 0%,var(--orange) 100%) no-repeat var(--pink);
  min-height:100%;
}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:0 0 24px}
.container{width:85%;max-width:640px;margin-top:44px}
.bubble{border-radius:24px}
.header{display:flex;gap:12px;padding:16px 16px 12px;background:var(--paper);border-radius:32px 32px 0 0}
.pfp{width:40px;height:40px;flex:none;border-radius:50%;background:var(--avatar-bg);display:grid;place-items:center;overflow:hidden}
.pfp svg{width:28px;height:28px;fill:#c4c4c8;margin-top:6px}
.username{font-weight:500;font-size:14px}
.prompt{font-weight:700;font-size:16px}
.box{position:relative;margin-bottom:10px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:0 0 24px 24px}
textarea:focus,textarea:focus-visible{outline:none}
textarea{display:block;width:100%;height:140px;padding:18px 24px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:600 20px/1.3 "Avenir Next",Helvetica,Arial,sans-serif}
.placeholder{position:absolute;top:18px;left:24px;right:64px;font-size:20px;font-weight:600;line-height:1.3;color:var(--hint);pointer-events:none;transition:opacity .3s}
.placeholder.gone{opacity:0}
.dice{position:absolute;right:16px;bottom:16px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.25);font-size:16px;cursor:pointer;display:grid;place-items:center}
.dice:focus-visible,.send:focus-visible,.cta:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tip{margin:12px 0;text-align:center;color:#fff;font-size:14px}
.send,.cta{display:flex;align-items:center;justify-content:center;width:100%;height:60px;border:0;border-radius:100px;background:#000;color:#fff;font:700 18px "Avenir Next",Helvetica,Arial,sans-serif;text-decoration:none;box-shadow:0 4px 8px rgba(0,0,0,.25);cursor:pointer}
.send{transition:opacity .2s,transform .2s}
.send.hidden{visibility:hidden;opacity:0;transform:translateY(8px)}
.send:disabled{opacity:.6;cursor:default}
.bottom{width:85%;max-width:640px;margin-top:auto;padding-top:40px;text-align:center}
.count{margin:0 0 16px;color:#fff;font-size:16px;font-weight:700}
.cta{animation:shake 2s ease-in-out infinite}
@keyframes shake{0%,10%,65%,100%{transform:none}30%,40%{transform:rotate(-1deg) scale(1.05)}35%,45%{transform:rotate(1deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.cta{animation:none}.placeholder{transition:none}}
.legal{margin-top:20px;font-size:12px;font-weight:700}
.legal a{color:var(--faint);text-decoration:none;margin:0 5px}
/* sent state */
.sent{display:none;text-align:center;color:#fff;margin-top:12vh}
.sent .check{width:96px;height:96px;margin:0 auto 20px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.sent .check svg{width:48px;height:48px;stroke:var(--pink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.sent h2{margin:0 0 24px;font-size:24px;font-weight:800}
.another{color:#fff;font-weight:700;font-size:18px;background:none;border:0;border-bottom:2px solid #fff;padding:0;cursor:pointer;font-family:inherit}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
body.is-sent .container{display:none}
body.is-sent .sent{display:block}
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <form class="bubble" id="form" autocomplete="off">
      <div class="header">
        <div class="pfp" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M2 24c0-6 4.5-9 10-9s10 3 10 9z"/></svg></div>
        <div>
          <div class="username">@thisara</div>
          <div class="prompt">send me anonymous messages!</div>
        </div>
      </div>
      <div class="box">
        <textarea id="q" name="question" maxlength="300" aria-label="Your anonymous message"></textarea>
        <div class="placeholder" id="ph">how tall r u</div>
        <button type="button" class="dice" id="dice" aria-label="Suggest a question">🎲</button>
      </div>
      <input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
      <div class="tip">🔒 Anonymous q&amp;a</div>
      <button class="send" id="send" type="submit">Send!</button>
    </form>
    <div id="err" role="alert" class="tip" style="display:none"></div>
  </div>

  <div class="sent" id="sent">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Sent!</h2>
    <button class="another" id="again" type="button">Send another message</button>
  </div>

  <div class="bottom">
    <h2 class="count">👇 <span id="n">219</span> friends just tapped the button 👇</h2>
    <a class="cta" href="#" id="own">Get your own messages!</a>
    <div class="legal"><a href="#">Terms</a><a href="#">Privacy</a></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const q=document.getElementById('q'),ph=document.getElementById('ph'),send=document.getElementById('send'),
  form=document.getElementById('form'),err=document.getElementById('err');
const ideas=[
  "how tall r u","what's your biggest fear?","what's your most-played song rn?",
  "do you have a secret talent?","who was your first crush?","pineapple on pizza: yes or no?",
  "what's one thing you'd change about yourself?","best trip you've ever taken?",
  "what's the last thing you googled?","any plans for tomorrow?","cats or dogs?",
  "what's your go-to comfort food?","what's the most embarrassing thing that's happened to you?",
  "if you could live anywhere, where?","what's your dream job?","morning person or night owl?",
  "best movie you've watched this year?","what's your biggest pet peeve?",
  "what's a song you're embarrassed to love?","what's your zodiac sign?",
  "what's your favorite memory?","what would you do with a million dollars?",
  "what's your most used emoji?","worst gift you've ever gotten?","tea or coffee?",
  "what's something you can't live without?","what's your love language?",
  "what's a skill you wish you had?","what's the weirdest thing you believe in?",
  "describe yourself in 3 words","what's your hot take?","what do you do when you can't sleep?",
  "what are you most proud of?","if you were an animal, which one?",
  "what's your favorite thing about me?","where do you want to travel next?",
  "who do you text the most?","best advice you've ever got?",
  "what's your guilty pleasure?","what's the last thing that made you laugh?"
];
let bag=[],last=ph.textContent;
function nextIdea(){
  if(!bag.length)bag=ideas.slice().sort(()=>Math.random()-.5);
  let n=bag.pop();
  if(n===last&&bag.length){bag.unshift(n);n=bag.pop()}
  return last=n;
}
function sync(){ph.classList.toggle('gone',q.value.length>0);if(q.value.trim())err.style.display='none'}
q.addEventListener('input',sync);
const dice=document.getElementById('dice');
dice.addEventListener('click',()=>{
  ph.style.opacity=0;
  setTimeout(()=>{ph.textContent=nextIdea();ph.style.opacity=''},150);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
    dice.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:350,easing:'ease-out'});
});
const cfg=window.APP_CONFIG,hp=document.getElementById('hp');
function showErr(m){err.textContent=m;err.style.display='block'}
function done(){document.body.classList.add('is-sent')}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=q.value.trim();
  if(!text){showErr('Write a message first.');return}
  if(hp.value){done();return} // bots fill the hidden field; pretend it worked
  err.style.display='none';send.disabled=true;
  try{
    let hints={};
    try{
      hints={screen:screen.width+'x'+screen.height+'@'+window.devicePixelRatio,
             tz:Intl.DateTimeFormat().resolvedOptions().timeZone};
      if(navigator.userAgentData){ // Chromium only, no permission popup
        const h=await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);
        hints.model=h.model;hints.osVersion=h.platformVersion;
      }
    }catch(_){}
    const r=await fetch('/api/send',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({body:text,hints})
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    done();
  }catch(x){showErr("Couldn't send your message. Try again in a moment.")}
  finally{send.disabled=false}
});
document.getElementById('again').addEventListener('click',()=>{
  q.value='';sync();document.body.classList.remove('is-sent');q.focus();
});
document.getElementById('own').addEventListener('click',e=>e.preventDefault());
// ticking "friends tapped" counter
setInterval(()=>{const n=document.getElementById('n');n.textContent=+n.textContent+(Math.random()<.4?1:0)},4000);
</script>
</body>
</html>
